[package]
name = "sessiongator"
version = "0.4.1"
edition = "2021"
description = "🐊 Rust TUI browser for AI coding sessions"
license = "MIT"
repository = "https://github.com/Yarden-zamir/sessiongator"
keywords = ["tui", "ratatui", "sessions", "claude", "opencode"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
crossterm = "0.29"
figment = { version = "0.10", features = ["toml"] }
gator = { git = "https://github.com/Yarden-zamir/gator", branch = "main" }
ratatui = "0.30"
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tui-input = { version = "0.15", features = ["crossterm"] }

[[bin]]
name = "sessiongator"
path = "src/main.rs"
