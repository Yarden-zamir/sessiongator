# Native session import compatibility manifest. sessiongator compiles this
# file in; rebuild after you change it.
#
# Statuses (docs/specs/native-session-import.md, "Version Policy"):
#   verified       A full pass on a machine with real clients and model keys:
#                  the target tool resumed an imported session and answered
#                  from its history. Written by scripts/full-pass-native-import.sh.
#   probe-passed   A CI round trip without model calls. Written by the daily
#                  native import compatibility workflow.
#   read-observed  Sessions from this version range were read. Source only.
# Versions between two verified versions of one major version are "bracketed"
# and count as verified. sessiongator derives that; never write it here.

