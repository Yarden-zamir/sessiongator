name: native import compatibility

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: "cargo test -- convert:: stores:: trash:: history::"

  latest-tools:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: Install the latest harnesses
        id: versions
        shell: bash
        run: |
          mkdir -p artifacts/native-import-latest
          # @opencode/cli is OpenCode 2; sessiongator writes OpenCode 2 only.
          npm install -g @anthropic-ai/claude-code @opencode/cli @openai/codex @github/copilot
          for tool in claude opencode codex copilot; do
            printf '%s: %s\n' "$tool" "$("$tool" --version | head -1)"
          done | tee artifacts/native-import-latest/tool-versions.txt
          {
            echo 'list<<VERSIONS'
            cat artifacts/native-import-latest/tool-versions.txt
            echo VERSIONS
          } >> "$GITHUB_OUTPUT"
      - run: cargo build --release
      - name: Probe every conversion pair without model calls
        run: scripts/probe-native-import-latest.sh
        env:
          SESSIONGATOR_NATIVE_IMPORT_ARTIFACTS: artifacts/native-import-latest
      - name: Record the installed versions as probe-passed
        run: |
          node scripts/update-native-import-versions.mjs \
            --status probe-passed \
            --source ci-probe \
            --notes "Every tool pair converted in isolated stores; the tool exported, read, or parsed each written session without model calls." \
            claude opencode codex copilot \
            > artifacts/native-import-latest/manifest-changes.toml
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-import-latest-report
          path: artifacts/native-import-latest/**
      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: docs/specs/native-session-import-versions.toml
          branch: automation/native-import-supported-versions
          delete-branch: true
          title: "chore: record native import compatibility probes"
          commit-message: "chore: record native import compatibility probes"
          body: |
            Records the latest tool versions as `probe-passed`: every conversion pair passed in isolated stores, and each tool accepted the written sessions without model calls. The scheduled full pass on the VPS marks a version `verified`.

            ```
            ${{ steps.versions.outputs.list }}
            ```
