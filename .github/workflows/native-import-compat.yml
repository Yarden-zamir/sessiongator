name: native import compatibility

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test native_import -- --nocapture

  latest-tools:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: Install latest supported harnesses
        shell: bash
        run: |
          mkdir -p artifacts/native-import-latest
          npm install -g @anthropic-ai/claude-code opencode-ai @openai/codex @github/copilot
          read -r claude_version _ <<< "$(claude --version)"
          read -r opencode_version _ <<< "$(opencode --version)"
          read -r _ codex_version <<< "$(codex --version)"
          read -r _ _ _ copilot_version <<< "$(copilot --version)"
          copilot_version="${copilot_version%.}"
          {
            printf 'CLAUDE_VERSION=%s\n' "$claude_version"
            printf 'OPENCODE_VERSION=%s\n' "$opencode_version"
            printf 'CODEX_VERSION=%s\n' "$codex_version"
            printf 'COPILOT_VERSION=%s\n' "$copilot_version"
          } >> "$GITHUB_ENV"
          printf '{"claude":"%s","opencode":"%s","codex":"%s","copilot":"%s"}\n' \
            "$claude_version" "$opencode_version" "$codex_version" "$copilot_version" \
            > artifacts/native-import-latest/tool-versions.json
      - run: cargo build --release
      - name: Probe latest native import compatibility
        run: scripts/probe-native-import-latest.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SESSIONGATOR_REQUIRE_CLAUDE_NATIVE: "1"
          SESSIONGATOR_NATIVE_IMPORT_ARTIFACTS: artifacts/native-import-latest
      - name: Record sessiongator round-trip results
        run: |
          node scripts/update-native-import-versions.mjs \
            --claude "$CLAUDE_VERSION" \
            --claude-native true \
            --opencode "$OPENCODE_VERSION" \
            --codex "$CODEX_VERSION" \
            --codex-native true \
            --copilot "$COPILOT_VERSION" \
            > artifacts/native-import-latest/manifest-additions.toml
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-import-latest-report
          path: artifacts/native-import-latest/**
      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: docs/specs/native-session-import-versions.toml
          branch: automation/native-import-supported-versions
          delete-branch: true
          title: "chore: record native import compatibility probes"
          commit-message: "chore: record native import compatibility probes"
          body: |
            Records sessiongator round-trip results for the latest tools. These versions remain unsupported until each native harness accepts the generated session.

            Detected versions:
            - Claude: `${{ env.CLAUDE_VERSION }}`
            - opencode: `${{ env.OPENCODE_VERSION }}`
            - Codex: `${{ env.CODEX_VERSION }}`
            - Copilot: `${{ env.COPILOT_VERSION }}`
