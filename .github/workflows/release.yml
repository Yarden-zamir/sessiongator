name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - Readme.md
      - readme.md
      - .github/workflows/**
  workflow_dispatch:

# Never let two releases race: each pushes a version commit to main.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: sessiongator
  REPO: sessiongator

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  # Derives the next version from the commits since the last tag, commits the
  # bump, and tags it. Releases nothing when there are no new commits, which
  # is what keeps its own release commit from triggering another release.
  version:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      released: ${{ steps.bump.outputs.released }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN }}
      - id: bump
        run: bash .github/scripts/bump-version.sh sessiongator

  # Built from the tag so the binary carries the released version.
  build:
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: macos-14
            artifact: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: |
          mkdir -p dist
          cp "target/release/${BIN}" "dist/${BIN}"
          tar -C dist -czf "${BIN}-${{ matrix.artifact }}.tar.gz" "${BIN}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ matrix.artifact }}
          path: ${{ env.BIN }}-${{ matrix.artifact }}.tar.gz

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - id: release
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/scripts/release-notes.sh "$tag" > release-notes.md
          gh release create "$tag" dist/*.tar.gz --title "$tag" --notes-file release-notes.md
          echo "released=true" >> "$GITHUB_OUTPUT"

  homebrew:
    needs: [version, release]
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: Yarden-zamir/homebrew-tap/.github/workflows/sync-formula.yml@main
    with:
      formula: sessiongator
      tag: ${{ needs.version.outputs.tag }}
      repository: Yarden-zamir/sessiongator
    secrets:
      token: ${{ secrets.TOKEN }}
